# Configuration HCI USB pour le nRF52840 Dongle utilisé par Bumble.
#
# Le protocole Kinvent reste piloté côté Python à partir des captures
# officielles. Cette configuration ne change que la capacité du contrôleur BLE :
# les K-Force Plates nécessitent deux connexions simultanées.

CONFIG_BT_MAX_CONN=2

# Deux K-Force Plates envoient des notifications en même temps. Les buffers
# contrôleur restent de la plomberie HCI USB Zephyr : ils ne modifient pas les
# commandes Kinvent, mais évitent qu'un des deux liens ACL soit perdu dès les
# premières écritures/notifications.
CONFIG_BT_CTLR_RX_BUFFERS=18
CONFIG_BT_BUF_ACL_RX_COUNT=12
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_EVT_RX_COUNT=20
