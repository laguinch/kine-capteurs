<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>K‑Push — Choix du test</title>
    <link rel="stylesheet" href="/static/styles.css?v=11">
  </head>
  <body>
    <main class="shell home-shell sensor-setup" data-sensor="kpush" data-test-path="/kpush/test">
      <nav class="sensor-nav">
        <a href="/">Accueil</a>
        <a href="/kforceplates">K‑Force Plates</a>
        <a class="active" href="/kpush">K‑Push</a>
        <a href="/kpull">K‑Pull</a>
        <a href="/kmove">K‑Move</a>
      </nav>
      <header class="hero">
        <p class="eyebrow">K‑Push</p>
        <h1>Choisir le test</h1>
        <p class="subtitle">Sélectionnez l’articulation, puis l’amplitude testée.</p>
      </header>

      <section class="setup-step">
        <p class="eyebrow">Articulation</p>
        <div id="jointChoices" class="choice-grid anatomy-grid"></div>
      </section>

      <section id="movementStep" class="setup-step hidden">
        <p class="eyebrow">Amplitude testée</p>
        <h2 id="selectedJointTitle">—</h2>
        <div id="movementChoices" class="choice-grid movement-grid"></div>
      </section>
    </main>
    <script src="/static/sensor_setup.js?v=2"></script>
  </body>
