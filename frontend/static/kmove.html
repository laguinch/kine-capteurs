<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>K‑Move — Choix du test</title>
    <link rel="stylesheet" href="/static/styles.css?v=12">
  </head>
  <body>
    <main class="shell home-shell sensor-setup" data-sensor="kmove" data-test-path="/kmove/test">
      <nav class="sensor-nav">
        <a href="/">Accueil</a>
        <a href="/appareils">Appareils</a>
        <a href="/kforceplates">K‑Force Plates</a>
        <a href="/kpush">K‑Push</a>
        <a href="/kpull">K‑Pull</a>
        <a class="active" href="/kmove">K‑Move</a>
      </nav>
      <header class="hero">
        <p class="eyebrow">K‑Move</p>
        <h1>Choisir le test</h1>
        <p class="subtitle">Sélectionnez l’articulation, puis une amplitude ou un bilan global.</p>

      <section class="setup-step">
        <p class="eyebrow">Articulation</p>
        <div id="jointChoices" class="choice-grid anatomy-grid"></div>

      <section id="movementStep" class="setup-step hidden">
        <p class="eyebrow">Amplitude testée</p>
        <h2 id="selectedJointTitle">—</h2>
        <div id="movementChoices" class="choice-grid movement-grid"></div>
      </section>
    </main>
    <script src="/static/sensor_setup.js?v=5"></script>
