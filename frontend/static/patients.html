<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patients — Kine Capteurs</title>
    <link rel="stylesheet" href="/static/styles.css?v=8">
  </head>
  <body>
    <main class="shell home-shell">
      <nav class="sensor-nav">
        <a href="/">Accueil</a>
      </nav>
      <header class="hero">
        <p class="eyebrow">Dossier patient</p>
        <h1>Choisir un patient</h1>
        <p class="subtitle">
          Cette page préparera la recherche dans la base patients du cabinet.
        </p>
      </header>

      <section class="panel patient-panel">
        <div class="patient-toolbar">
          <label>
            Rechercher un patient
            <input id="patientSearch" placeholder="Nom, prénom ou pathologie">
          </label>
          <button id="showCreateButton" class="primary" type="button">Nouveau patient</button>
        </div>

        <form id="patientForm" class="patient-form hidden">
          <div class="form-grid">
            <label>
              Nom
              <input id="patientLastName" required>
            </label>
            <label>
              Prénom
              <input id="patientFirstName" required>
            </label>
            <label>
              Date de naissance
              <input id="patientBirthDate" type="date">
            </label>
            <label>
              Date d’ordonnance
              <input id="patientPrescriptionDate" type="date">
            </label>
          </div>
          <label>
            Pathologie
            <input id="patientCondition" placeholder="Ex : genou, épaule, rachis…">
          </label>
          <label>
            Commentaires
            <textarea id="patientNotes" rows="3"></textarea>
          </label>
          <div class="form-actions">
            <button class="primary" type="submit">Créer le patient</button>
            <button id="cancelCreateButton" class="secondary" type="button">Annuler</button>
          </div>
        </form>

        <div id="patientMessage" class="message hidden"></div>
        <div id="patientList" class="patient-list"></div>
        <a class="download" href="/session/anonyme?context=anonymous">Continuer en test anonyme</a>
      </section>
    </main>
    <script src="/static/patients.js?v=1"></script>
  </body>
</html>
